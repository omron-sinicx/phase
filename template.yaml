teaser: teaser.png
overview: |
  Contact-rich assembly tasks such as peg-in-hole insertion remain difficult to learn from limited
  demonstrations. While retrieval-augmented imitation learning, which augments target
  demonstrations with relevant prior data, offers a promising direction, its applicability to
  contact-rich manipulation remains largely unexplored. Contact-rich insertion unfolds over
  multiple phases from search to insert, and retrieving phase-specific experience from prior data
  in principled ways remains an open question. Our key insight is that a compliant wrist enables
  the robot to sustain contact throughout execution, producing rich tactile and force signals that
  naturally reveal the phase structure of insertion and inform what should be retrieved. Based on
  this insight, we present PHASE (PHase-Aware Segmentation and REtrieval), a framework for
  compliance-enabled tactile phase retrieval that integrates multimodal contact-aware
  representation learning, variable-length phase segmentation from tactile signals, and phase-
  consistent retrieval for policy learning. We evaluate PHASE on real-world peg-in-hole insertion
  across five peg geometries, comparing against retrieval strategies drawn from state-of-the-art
  methods under a shared policy architecture. PHASE improves the overall success rate by 13
  percentage points over the strongest non-phase-aware baseline, and improves performance under
  unseen initial positions by 30 percentage points. These results demonstrate that aligning
  retrieval with interaction-defined contact phases substantially improves robustness in few-shot
  insertion learning.

body:
  - title: Method
    text: |
      PHASE (**PH**ase-**A**ware **S**egmentation and **RE**trieval) runs in three stages. A masked
      tactile-proprioceptive encoder named MAT $^3$ is first trained on the prior dataset with
      self-supervised masked reconstruction, giving per-frame embeddings that capture
      force-driven interaction dynamics without any phase labels. Demonstrations are then
      segmented at *interaction-defined* boundaries and matched phase-to-phase, and an ACT policy
      is finally trained on the target demonstrations plus the retrieved, phase-consistent
      segments.

      <img src="method.png" class="uk-align-center uk-responsive-width" alt="" />
      <span class="uk-text-meta">Figure 2: Overview of PHASE. The framework consists of three stages: (1) Tactile Representation Learning, where a masked tactile-proprioceptive encoder learns embeddings that capture force-driven interaction dynamics; (2) Phase-Aware Segmentation &amp; Retrieval, where demonstrations are segmented using tactile-estimated torque signals to identify interaction-defined contact phases and variable-length segments are retrieved accordingly; and (3) Policy Training, where an ACT policy is trained on the retrieved, phase-consistent segments for robust peg-in-hole insertion.</span>

      The soft wrist is what makes segmentation possible: passive 6D compliance keeps the peg in
      sustained contact, so the tactile-estimated torque $\hat\tau = \sum_i r_i \times f_i$ stays
      smooth enough to read. A boundary is placed at the first frame after the contact peak where
      the coefficient of variation of $\|\hat\tau\|$ drops below $\eta$, the onset of stable
      engagement, splitting each insertion into a **search** and an **insert** phase. Because
      that moment depends on geometry and initial pose, the resulting segments are naturally
      variable in length, and retrieval uses FastDTW between per-frame embeddings so segments of
      different duration can still be aligned, restricted to matching phases.

      <img src="method2.png" class="uk-align-center uk-responsive-width" alt="" />
      <span class="uk-text-meta">Figure 3: Tactile-Based Phase Segmentation. The top panel shows the tactile-estimated torque magnitude (dark curve) and its signed components (light curves); the bottom panel shows the coefficient of variation (CV) of the torque magnitude. The boundary between search and insert is detected at the first frame where CV &lt; η after the contact peak.</span>
  - title: Results
    text: |
      We evaluate on real-world peg-in-hole insertion with a UR5e, a soft wrist, and a 3×3
      distributed tactile sensor, across five peg geometries: circle and square are in the prior
      data, while rectangle, oval, and hexagon are unseen. From 122 prior demonstrations and only
      4 target demonstrations per shape, PHASE reaches 77% success, 13 percentage points above the
      strongest non-phase-aware baseline, and every retrieval strategy is compared under the same
      ACT policy architecture.

      #### Real-world success rate (20 trials per shape, 100 per method)
      <div class="uk-overflow-auto">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr><th></th><th colspan="2"><b>Seen Shapes</b></th><th colspan="3"><b>Unseen Shapes</b></th><th></th></tr>
            <tr><th><b>Method</b></th><th><b>Circle</b></th><th><b>Square</b></th><th><b>Rectangle</b></th><th><b>Oval</b></th><th><b>Hexagon</b></th><th><b>Total</b></th></tr>
          </thead>
          <tbody>
            <tr><td>Target-Only</td><td>13/20</td><td>6/20</td><td>9/20</td><td>15/20</td><td>7/20</td><td>50/100 (50%)</td></tr>
            <tr><td>BC-Prior</td><td><b>19/20</b></td><td>10/20</td><td>4/20</td><td>17/20</td><td>14/20</td><td>64/100 (64%)</td></tr>
            <tr><td>Retrieval-Single [8]</td><td>13/20</td><td>7/20</td><td>7/20</td><td>14/20</td><td><b>15/20</b></td><td>56/100 (56%)</td></tr>
            <tr><td>Retrieval-Full [38]</td><td>16/20</td><td>9/20</td><td>7/20</td><td>19/20</td><td>13/20</td><td>64/100 (64%)</td></tr>
            <tr><td>Retrieval-Window [4]</td><td>16/20</td><td>10/20</td><td>6/20</td><td>16/20</td><td>7/20</td><td>55/100 (55%)</td></tr>
            <tr class="uk-active"><td><b>PHASE (Ours)</b></td><td>18/20</td><td><b>12/20</b></td><td><b>13/20</b></td><td><b>20/20</b></td><td>14/20</td><td><b>77/100 (77%)</b></td></tr>
          </tbody>
        </table>
      </div>

      The gap widens under distribution shift. Starting the robot from positions never seen in
      training, PHASE retains 47% success where the best baseline manages 17%.

      #### Success rate under unseen starting positions (20 trials per shape, 100 total)
      <div class="uk-overflow-auto">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr><th><b>Method</b></th><th><b>Circle</b></th><th><b>Square</b></th><th><b>Rectangle</b></th><th><b>Oval</b></th><th><b>Hexagon</b></th><th><b>Total</b></th></tr>
          </thead>
          <tbody>
            <tr><td>Target-Only</td><td>0/20</td><td>0/20</td><td>0/20</td><td>0/20</td><td>0/20</td><td>0/100 (0%)</td></tr>
            <tr><td>BC-Prior</td><td>5/20</td><td>2/20</td><td>3/20</td><td>5/20</td><td>2/20</td><td>17/100 (17%)</td></tr>
            <tr><td>Retrieval-Single [8]</td><td>0/20</td><td>1/20</td><td>1/20</td><td>0/20</td><td>0/20</td><td>2/100 (2%)</td></tr>
            <tr><td>Retrieval-Full [38]</td><td>4/20</td><td>4/20</td><td>4/20</td><td>2/20</td><td>0/20</td><td>14/100 (14%)</td></tr>
            <tr><td>Retrieval-Window [4]</td><td>6/20</td><td>5/20</td><td>5/20</td><td>0/20</td><td>0/20</td><td>16/100 (16%)</td></tr>
            <tr class="uk-active"><td><b>PHASE (Ours)</b></td><td><b>12/20</b></td><td><b>8/20</b></td><td><b>12/20</b></td><td><b>9/20</b></td><td><b>6/20</b></td><td><b>47/100 (47%)</b></td></tr>
          </tbody>
        </table>
      </div>
projects:
  - title: 'Tactile Memory with Soft Robot: Robust Object Insertion via Masked Encoding and Soft Wrist'
    journal: "RA-L'26"
    img: https://arxiv.org/html/2601.19275v1/x2.png
    description: |
      A soft wrist explores contact safely while a tactile memory retrieves past demonstrations, so the robot adapts to unseen pegs and conditions. The Masked Tactile Trajectory Transformer (MAT³) learns representations by masked-token prediction over tactile, force-torque, and proprioceptive signals.
    url: https://omron-sinicx.github.io/tameso
  - title: 'Multi-Agent Behavior Retrieval: Retrieval-Augmented Policy Training for Cooperative Manipulation by Mobile Robots'
    journal: "IROS'24"
    img: https://omron-sinicx.github.io/mabr/assets/method.png
    description: |
      A Transformer-based skill encoder builds a multi-agent coordination skill database, so mobile robots retrieve relevant prior demonstrations to augment policy training and beat few-shot imitation learning on cooperative push manipulation.
    url: https://omron-sinicx.github.io/mabr/
